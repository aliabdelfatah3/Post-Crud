<div class="min-h-screen bg-gray-100 p-4 md:p-8 flex justify-center items-center">
  <div class="max-w-2xl w-full bg-white rounded-2xl shadow-2xl overflow-hidden" *ngIf="post">
    <div class="bg-blue-600 p-6 flex items-center justify-between">
      <h2 class="text-xl md:text-2xl font-bold text-white">Post Details</h2>
      <span class="bg-white/20 text-white text-sm font-mono px-3 py-1 rounded-full backdrop-blur-sm"
        >#{{ post.id }}</span
      >
    </div>

    <div class="p-6 md:p-10">
      <h3 class="text-2xl font-bold text-gray-800 mb-4 leading-tight">{{ post.title }}</h3>
      <div class="w-12 h-1 bg-blue-500 mb-6 rounded-full"></div>
      <p
        class="text-gray-600 leading-relaxed text-lg bg-gray-50 p-4 rounded-xl border border-gray-100 italic"
      >
        {{ post.body }}
      </p>

      <div class="mt-10 pt-6 border-t border-gray-100 text-center sm:text-left">
        <button
          routerLink="/posts"
          class="inline-flex items-center text-blue-600 hover:text-blue-800 transition font-bold group"
        >
          <svg
            class="w-5 h-5 mr-2 transform group-hover:-translate-x-1 transition"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
          Return to Dashboard
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="flex flex-col items-center gap-4">
    <div
      class="animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent"
    ></div>
    <p class="text-gray-500 font-medium">Fetching post data...</p>
  </div>
  <div *ngIf="!isLoading && !post" class="text-center text-gray-500">Post not found.</div>
</div>
