<div class="min-h-screen bg-gray-200 p-8 flex justify-center items-center">
  <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl p-8" *ngIf="post">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-3xl font-bold text-gray-800">Post Details</h2>
      <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded"
        >ID: {{ post.id }}</span
      >
    </div>

    <div class="border-t border-gray-100 pt-6">
      <h3 class="text-xl font-semibold text-blue-600 mb-4">{{ post.title }}</h3>
      <p class="text-gray-600 leading-relaxed text-lg">
        {{ post.body }}
      </p>
    </div>

    <div class="mt-8 pt-6 border-t border-gray-100">
      <button
        routerLink="/posts"
        class="flex items-center text-gray-700 hover:text-blue-600 transition font-medium"
      >
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 19l-7-7m0 0l7-7m-7 7h18"
          ></path>
        </svg>
        Back to Posts List
      </button>
    </div>
  </div>

  <div *ngIf="!post" class="text-center text-gray-500">Loading post details...</div>
</div>
