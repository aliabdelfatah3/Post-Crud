<div class="min-h-screen bg-gray-200 p-8">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">
      {{ isEditMode ? 'Edit Post' : 'Add New Post' }}
    </h2>

    <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">Title</label>
        <input
          type="text"
          formControlName="title"
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
          [ngClass]="{
            'border-red-500': postForm.get('title')?.invalid && postForm.get('title')?.touched,
          }"
        />
        <p
          *ngIf="postForm.get('title')?.invalid && postForm.get('title')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Title is required (min 5 characters).
        </p>
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 font-medium mb-2">Description (Body)</label>
        <textarea
          formControlName="body"
          rows="4"
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
        ></textarea>
      </div>

      <div class="flex gap-3">
        <button
          type="submit"
          [disabled]="postForm.invalid"
          class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 disabled:opacity-50"
        >
          {{ isEditMode ? 'Update' : 'Save' }}
        </button>
        <button
          type="button"
          routerLink="/posts"
          class="bg-gray-300 px-6 py-2 rounded-lg hover:bg-gray-400"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
