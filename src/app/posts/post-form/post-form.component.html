<div class="min-h-screen bg-gray-100 p-4 md:p-8">
  <div class="max-w-2xl mx-auto bg-white rounded-xl md:rounded-2xl shadow-lg p-6 md:p-8">
    <h2 class="text-xl md:text-2xl font-bold mb-6 text-gray-800 border-b pb-4">
      {{ isEditMode ? 'Edit Post' : 'Add New Post' }}
    </h2>

    <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">Title</label>
        <input
          type="text"
          formControlName="title"
          placeholder="Enter post title"
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none transition-all"
          [ngClass]="{
            'border-red-500': postForm.get('title')?.invalid && postForm.get('title')?.touched,
          }"
        />
        <p
          *ngIf="postForm.get('title')?.invalid && postForm.get('title')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Title is required (min 5 characters).
        </p>
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 font-medium mb-2">Description (Body)</label>
        <textarea
          formControlName="body"
          rows="4"
          placeholder="Write your content here..."
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none transition-all"
        ></textarea>
        <p
          *ngIf="postForm.get('body')?.invalid && postForm.get('body')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Body is required.
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <button
          type="submit"
          [disabled]="postForm.invalid"
          class="w-full sm:w-auto bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 disabled:opacity-50 font-semibold transition"
        >
          {{ isEditMode ? 'Update Post' : 'Save Post' }}
        </button>
        <button
          type="button"
          routerLink="/posts"
          class="w-full sm:w-auto bg-gray-200 text-gray-700 px-8 py-3 rounded-lg hover:bg-gray-300 transition font-semibold"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
