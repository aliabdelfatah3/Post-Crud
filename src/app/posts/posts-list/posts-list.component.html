<div class="min-h-screen bg-gray-100 p-2 md:p-8">
  <div class="max-w-6xl mx-auto bg-white rounded-xl md:rounded-2xl shadow-lg p-4 md:p-8">
    <h1
      class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-6 uppercase tracking-wider"
    >
      Post CRUD
    </h1>

    <div class="flex flex-wrap justify-center gap-3 mb-8">
      <button
        routerLink="/posts/add"
        class="flex-1 sm:flex-none bg-gray-800 text-white px-6 py-2.5 rounded shadow hover:bg-black transition font-medium"
      >
        + Add Post
      </button>
      <button
        (click)="resetToDefault()"
        class="flex-1 sm:flex-none bg-blue-500 text-white px-6 py-2.5 rounded shadow hover:bg-blue-600 transition flex items-center justify-center gap-2 font-medium"
      >
        🔄 <span class="hidden sm:inline">Reset Data</span><span class="sm:hidden">Reset</span>
      </button>
    </div>

    <div class="overflow-x-auto border rounded-xl">
      <ng-container *ngIf="pagedPosts$ | async as posts">
        <!-- ✅ Loading -->
        <div *ngIf="isLoading" class="text-center py-10 text-gray-500">Loading posts...</div>

        <!-- ✅ Empty -->
        <div *ngIf="!isLoading && posts.length === 0" class="text-center py-10 text-gray-500">
          No posts available
        </div>

        <!-- Posts table -->
        <table
          *ngIf="!isLoading && posts.length > 0"
          class="w-full text-left border-collapse min-w-[700px]"
        >
          <thead>
            <tr class="bg-gray-50 border-b-2 border-gray-200 text-gray-700">
              <th class="py-4 px-4 font-bold uppercase text-xs">#</th>
              <th class="py-4 px-4 font-bold uppercase text-xs">Title</th>
              <th class="py-4 px-4 font-bold uppercase text-xs">Body Preview</th>
              <th class="py-4 px-4 font-bold uppercase text-xs text-center">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <tr *ngFor="let post of posts" class="hover:bg-blue-50/50 transition">
              <td class="py-4 px-4 text-gray-400 font-mono">{{ post.id }}</td>
              <td class="py-4 px-4 font-semibold text-gray-800">
                {{ post.title | slice: 0 : 25 }}...
              </td>
              <td class="py-4 px-4 text-gray-500 italic">{{ post.body | slice: 0 : 40 }}...</td>
              <td class="py-4 px-4 text-center whitespace-nowrap">
                <div class="flex justify-center gap-1.5">
                  <button
                    [routerLink]="['/posts', post.id]"
                    class="p-2 bg-blue-100 text-blue-600 rounded-md hover:bg-blue-600 hover:text-white transition"
                  >
                    View
                  </button>
                  <button
                    [routerLink]="['/posts/edit', post.id]"
                    class="p-2 bg-gray-100 text-gray-600 rounded-md hover:bg-gray-600 hover:text-white transition"
                  >
                    Edit
                  </button>
                  <button
                    (click)="deletePost(post.id)"
                    class="p-2 bg-red-100 text-red-600 rounded-md hover:bg-red-600 hover:text-white transition"
                  >
                    Delete
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </ng-container>
    </div>

    <!-- Pagination -->
    <ng-container *ngIf="!isLoading && totalItems > 0 && (currentPage$ | async) as currentPage">
      <app-pagination
        [totalItems]="totalItems"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        [pageSizeOptions]="[5, 10, 25]"
        (pageChange)="changePage($event)"
        (pageSizeChange)="onPageSizeChange($event)"
      />
    </ng-container>
  </div>
</div>
